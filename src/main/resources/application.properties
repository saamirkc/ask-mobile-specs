spring.application.name=openai
server.port=${PORT:8080}

spring.ai.google.genai.apiKey=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.5-flash-lite
spring.ai.google.genai.chat.options.temperature=0.7
spring.ai.google.genai.embedding.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.embedding.text.options.model=gemini-embedding-001
spring.ai.google.genai.embedding.text.options.dimensions=1536


spring.datasource.url=jdbc:postgresql://aws-0-ap-northeast-1.pooler.supabase.com:5432/postgres
spring.datasource.username=${USERNAME}
spring.datasource.password=${PASSWORD}
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
spring.ai.vectorstore.pgvector.dimensions=1536



s3.bucket-name=rag-documents
s3.region=us-east-1
s3.endpoint=https://buvonqynrxocqetpczyh.storage.supabase.co/storage/v1/s3
s3.access-key=${ACCESS_KEY}
s3.secret-key=${SECRET_KEY}